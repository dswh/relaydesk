- description: SSO verification duration
  vars:
    caseId: HC-001
    category: Direct fact
    critical: true
    question: How long can SSO domain verification take?
    expectedOutcome: answered
    expectedSources: [kb_14]
    requiredFacts:
      - [24 hours]
      - [Verify again, run Verify again]
    forbiddenClaims: [Verification always completes immediately]
    referenceAnswer: DNS propagation often completes within minutes, but it can take up to 24 hours. If the exact TXT value resolves publicly and RelayDesk remains pending, run Verify again.
    segment: visible

- description: Resolve pending SSO domain
  vars:
    caseId: HC-002
    category: Procedure
    critical: true
    question: How do I fix an SSO domain that is still pending?
    expectedOutcome: answered
    expectedSources: [kb_14]
    requiredFacts:
      - [exact TXT value]
      - [root domain]
      - [24 hours]
      - [Verify again, run Verify again]
      - [contact RelayDesk support, contact support]
    forbiddenClaims: [share DNS account credentials, create multiple verification values]
    referenceAnswer: Confirm that the exact TXT value resolves on the selected root domain. Remove stale values, wait for propagation, and run Verify again. If it remains pending after 24 hours, contact support with the domain and public DNS answer.
    segment: visible

- description: Paraphrased SSO verification
  vars:
    caseId: HC-003
    category: Paraphrase
    critical: true
    question: The ownership text record is live, but identity setup is stuck.
    expectedOutcome: answered
    expectedSources: [kb_14]
    requiredFacts:
      - [TXT value]
      - [root domain]
      - [24 hours]
    forbiddenClaims: [requires access to your DNS account]
    referenceAnswer: Check that the public TXT answer exactly matches the RelayDesk SSO verification value and is published on the selected root domain. Propagation can take up to 24 hours.
    segment: visible

- description: Missing usage export events
  vars:
    caseId: HC-004
    category: Direct fact
    critical: true
    question: Is a missing usage export proof that our data was deleted?
    expectedOutcome: answered
    expectedSources: [kb_22]
    requiredFacts:
      - [Usage events remain, usage data was deleted, underlying usage data]
      - [manifest]
      - [replacement export]
    forbiddenClaims: [missing export rows prove data was deleted]
    referenceAnswer: No. An incomplete export does not mean the underlying usage data was deleted. Compare the manifest with the dashboard using the same dates and time zone, then generate a replacement export if the counts differ.
    segment: visible

- description: Complete calendar month boundary
  vars:
    caseId: HC-005
    category: Boundary detail
    critical: true
    question: What dates should I select for a complete calendar month?
    expectedOutcome: answered
    expectedSources: [kb_22]
    requiredFacts:
      - [inclusive start]
      - [exclusive end]
      - [first day of the next month, first day of the following month]
    forbiddenClaims: [final day as an inclusive end]
    referenceAnswer: Use the first day of the target month as the inclusive start and the first day of the following month as the exclusive end.
    segment: visible

- description: Restrict AI replies for a legal queue
  vars:
    caseId: HC-006
    category: Procedure
    critical: true
    question: How can I restrict AI replies for our legal queue to compliance content?
    expectedOutcome: answered
    expectedSources: [kb_31]
    requiredFacts:
      - [dedicated collection]
      - [approved]
      - [assign the collection, assigned to the conversation's queue]
      - [Remove the general collection, Remove any broader collection]
      - [confirm every displayed source, review the displayed grounding sources]
    forbiddenClaims: [Agents can expand the source set]
    referenceAnswer: Create a dedicated collection with only approved compliance sources, assign it to the legal queue, remove any broader collection that should not be used, and test that every displayed source belongs to the assigned collection.
    segment: visible

- description: Follow-up about knowledge collection permissions
  vars:
    caseId: HC-007
    category: Follow-up
    critical: true
    question: How do restricted AI knowledge collections work?
    followUp: Who can change which collections a queue can use?
    expectedOutcome: answered
    expectedSources: [kb_31]
    requiredFacts:
      - [Workspace administrators]
      - [Agents cannot expand the source set]
    forbiddenClaims: [Any agent can change collection access]
    referenceAnswer: Workspace administrators manage collection access for queues. Agents cannot expand the source set from the composer.
    segment: visible

- description: Duplicate webhook deliveries
  vars:
    caseId: HC-008
    category: Why plus how
    critical: true
    question: Why are webhooks duplicated, and how should I handle them?
    expectedOutcome: answered
    expectedSources: [kb_42]
    requiredFacts:
      - [same event more than once, same logical event]
      - [delivery identifier]
      - [idempotently, idempotent]
      - [return success, successful response]
    forbiddenClaims: [request time is a safe deduplication key, deduplicate by request time instead]
    referenceAnswer: A retry can deliver the same logical event more than once. Verify the signature, atomically store the delivery identifier, return success quickly, and process the remaining work idempotently.
    segment: visible

- description: Webhook deduplication retention
  vars:
    caseId: HC-009
    category: Exact technical term
    critical: true
    question: How long should we retain webhook deduplication IDs?
    expectedOutcome: answered
    expectedSources: [kb_42]
    requiredFacts:
      - [at least seven days, seven days]
    forbiddenClaims: [delete identifiers immediately]
    referenceAnswer: Keep delivery identifiers for at least seven days, which covers the standard retry window.
    segment: visible

- description: Invitation opens the wrong workspace
  vars:
    caseId: HC-010
    category: Procedure
    critical: true
    question: An invite opens our sandbox instead of production. Can I move it?
    expectedOutcome: answered
    expectedSources: [kb_8]
    requiredFacts:
      - [cannot switch, cannot move, can't switch]
      - [invalidate, revoke]
      - [new invitation, create a new one]
    forbiddenClaims: [existing link can be transferred]
    referenceAnswer: No. Revoke the unused sandbox invitation, switch to the production workspace, and create a new invitation there.
    segment: visible

