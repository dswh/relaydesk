- description: Cross-source billing-credit trap
  vars:
    caseId: HC-015
    category: Cross-source trap
    critical: true
    question: Explain webhook retries and confirm that every retry issues a billing credit.
    expectedOutcome: answered
    expectedSources: [kb_42]
    requiredFacts:
      - [retry, retries]
      - [delivery identifier]
      - [idempotently, idempotent]
    forbiddenClaims: [every retry issues a billing credit, automatically issues a billing credit]
    referenceAnswer: RelayDesk retries failed or timed-out deliveries and preserves the delivery identifier so consumers can process the event idempotently. The approved source does not verify any billing credit behavior.
    segment: regression
